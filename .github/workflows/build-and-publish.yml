name: Build Fleshka's Tunes for WebAssembly

on:
  push:
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip \
            cmake \
            ninja-build

      - name: Install aqtinstall
        run: |
          python3 -m pip install --user aqtinstall
          
      - name: Install Qt desktop
        run: |
          ~/.local/bin/aqt install-qt \
            linux desktop 6.8.3 \
            linux_gcc_64 \
            -O "$HOME/Qt"

      - name: Install Qt WebAssembly
        run: |
          ~/.local/bin/aqt install-qt \
            linux desktop 6.8.3 \
            wasm_multithread \
            -O "$HOME/Qt"

      - name: Add Qt to PATH
        run: |
          echo "$HOME/Qt/6.8.3/wasm_singlethread/bin" >> "$GITHUB_PATH"

      - name: Configure WebAssembly build
        run: |
          cmake -S . -B build-wasm \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/Qt/6.8.3/wasm_singlethread/lib/cmake/Qt6/qt.toolchain.cmake"

      - name: Build WebAssembly application
        run: |
          cmake --build build-wasm --parallel

      - name: Prepare web preview
        run: |
          mkdir -p out

          cp build-wasm/* out
          mv out/FleshkasTunes.html out/index.html
    

      - name: Upload WebAssembly preview
        uses: mmkal/artifact.ci/upload@main
        with:
          path: out
          artifactci-mode: eager
