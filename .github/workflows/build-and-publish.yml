name: Build Fleshka's Tunes for WebAssembly

on:
  push:
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            python3-pip

      - name: Install aqtinstall
        run: |
          python3 -m pip install --user aqtinstall
          
      - name: Install Qt desktop
        run: |
          ~/.local/bin/aqt install-qt \
            linux desktop 6.12.0 \
            linux_gcc_64 \
            -O "$HOME/Qt"
            
      - name: Install Qt WebAssembly
        run: |
          ~/.local/bin/aqt install-qt \
            all_os wasm 6.12.0 \
            wasm_singlethread \
            -O "$HOME/Qt"

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.5

      - name: Verify WebAssembly toolchain
        run: |
          emcc --version
          em++ --version
          echo "EMSDK=$EMSDK"
          test -f "$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"

      - name: Configure WebAssembly build
        run: |
          cmake -S . -B build-wasm \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/Qt/6.12.0/wasm_singlethread/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_CHAINLOAD_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DQT_HOST_PATH="$HOME/Qt/6.12.0/gcc_64"

      - name: Build WebAssembly application
        run: |
          cmake --build build-wasm --parallel

      - name: Prepare WebAssembly preview
        run: |
          mkdir -p out
          rsync -a \
            --exclude='CMakeCache.txt' \
            --exclude='CMakeFiles/' \
            --exclude='FleshkasTunes_autogen/' \
            --exclude='build.ninja' \
            --exclude='cmake_install.cmake' \
            --exclude='*.cpp' \
            --exclude='*.h' \
            --exclude='*.hpp' \
            --exclude='*.qmake' \
            --exclude='*.cmake' \
            --exclude='meta_types/' \
            --exclude='qmltypes/' \
            build-wasm/ out/
          mv out/FleshkasTunes.html out/index.html
          ls out/
          
      - name: Upload WebAssembly preview
        uses: mmkal/artifact.ci/upload@main
        with:
          path: out
          artifactci-mode: eager
